<div class="app-container">
  <mat-toolbar color="primary" *ngIf="isLoggedIn">
    <button mat-icon-button (click)="sidenav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <span>{{ title }}</span>
    <span class="spacer"></span>
    <span class="user-info" *ngIf="currentUser">
      {{ currentUser.firstName }} {{ currentUser.lastName }}
      <span class="role-badge">{{ currentUser.role | titlecase }}</span>
    </span>
    <span class="user-info" *ngIf="!currentUser">Guest</span>
    <button mat-icon-button [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container" *ngIf="isLoggedIn">
    <mat-sidenav #sidenav mode="side" opened>
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item 
           *ngFor="let item of getRoleBasedMenuItems()" 
           [routerLink]="item.route" 
           routerLinkActive="active">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <div *ngIf="!isLoggedIn" class="login-view">
    <router-outlet></router-outlet>
  </div>
</div>
