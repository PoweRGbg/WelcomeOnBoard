<div class="manager-tasks-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>My Tasks</mat-card-title>
      <mat-card-subtitle>Manage tasks you created</mat-card-subtitle>
    </mat-card-header>
    <task-filter
        [searchTerm]="searchTerm"
        [selectedDepartment]="selectedDepartment"
        (searchTermChange)="onSearchChange($event)"
        (selectedDepartmentChange)="onDepartmentChange($event)"
    ></task-filter>
    <mat-card-content>
      <div class="actions-bar">
        <button mat-raised-button color="primary" (click)="createTask()" [disabled]="isLoading">
          <mat-icon>add</mat-icon>
          Create Task
        </button>
      </div>

      <!-- Loading spinner -->
      <div *ngIf="isLoading" class="loading-container">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Loading tasks...</p>
      </div>

      <!-- Tasks table -->
      <div *ngIf="!isLoading" class="table-container">
        <table mat-table [dataSource]="tasks" class="tasks-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Task Name</th>
            <td mat-cell *matCellDef="let task">
              <div class="task-name">
                <strong>{{ task.name }}</strong>
                <div class="task-description" *ngIf="task.description">
                  {{ task.description }}
                </div>
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="department">
            <th mat-header-cell *matHeaderCellDef>Department</th>
            <td mat-cell *matCellDef="let task">
              <mat-chip>{{ task.department }}</mat-chip>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions Count</th>
            <td mat-cell *matCellDef="let task">
              <span class="actions-count">{{ task.actions.length }} actions</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions-edit">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let task">
              <div *ngIf="showActionButtons(task)" class="action-buttons">
                <button mat-icon-button (click)="editTask(task)" matTooltip="Edit Task" [disabled]="isLoading">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button (click)="duplicateTask(task)" matTooltip="Duplicate Task" [disabled]="isLoading">
                  <mat-icon>content_copy</mat-icon>
                </button>
                <button mat-icon-button (click)="deleteTask(task)" matTooltip="Delete Task" color="warn" [disabled]="isLoading">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <!-- Empty state -->
        <div *ngIf="tasks.length === 0" class="no-tasks">
          <mat-icon>assignment</mat-icon>
          <h3>No tasks found</h3>
          <p>Create your first task to get started</p>
          <button mat-raised-button color="primary" (click)="createTask()">
            <mat-icon>add</mat-icon>
            Create Task
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
