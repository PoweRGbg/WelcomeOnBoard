<mat-card>
  <mat-card-content>
    <div class="search-bar">
      <div class="search-controls">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>{{ ('ONBOARDING.SEARCH_TASKS' | translate) }}</mat-label>
          <input matInput [(ngModel)]="searchTerm" (input)="onSearchChange()"
            placeholder="{{ ('ONBOARDING.SEARCH_TASKS_PLACEHOLDER' | translate) }}">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="department-field">
          <mat-label>{{ ('ONBOARDING.DEPARTMENT' | translate) }}</mat-label>
          <mat-select [(ngModel)]="selectedDepartment" (selectionChange)="onDepartmentChange()">
            <mat-option *ngFor="let department of departments" [value]="department">
              {{ department }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-icon-button (click)="clearSearch()" matTooltip="Clear search"
          *ngIf="searchTerm || selectedDepartment">
          <mat-icon>clear</mat-icon>
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
