<div class="dashboard-container">
    <div class="dashboard-header">
        <h1>Здравей, {{ currentUser?.firstName }} {{ currentUser?.lastName }}!</h1>
        <div class="user-info">
            <span class="role-badge">{{ currentUser?.role | titlecase }}</span>
        </div>
    </div>

    <div class="stats-grid">

        <mat-card class="stat-card pending" (click)="navigateTo('/employee/tasks', 'pending')">
            <mat-card-content>
                <div class="stat-content">
                    <mat-icon>alarm</mat-icon>
                    <div class="stat-details">
                        <div class="stat-number">{{ userStats.pendingTasks }}</div>
                        <div class="stat-label">В очакване</div>
                    </div>
                </div>
            </mat-card-content>
        </mat-card>

        <mat-card class="stat-card completed" (click)="navigateTo('/employee/tasks', 'completed')">
            <mat-card-content>
                <div class="stat-content">
                        <mat-icon>done</mat-icon>
                    <div class="stat-details">
                        <div class="stat-number">{{ userStats.completedTasks }}</div>
                        <div class="stat-label">Завършени</div>
                    </div>
                </div>
            </mat-card-content>
        </mat-card>

        <mat-card class="stat-card" (click)="navigateTo('/employee/tasks')">
            <mat-card-content>
                <div class="stat-content">
                    <mat-icon class="stat-icon">assignment</mat-icon>
                    <div class="stat-details">
                        <div class="stat-number">{{ userStats.totalTasks }}</div>
                        <div class="stat-label">Общо задачи</div>
                    </div>
                </div>
            </mat-card-content>
        </mat-card>
    </div>

    <div class="actions-section">
        <h2>Бързи действия</h2>
        <div class="actions-grid">
            <mat-card 
                *ngFor="let action of getRoleBasedActions()"
                class="action-card"
                [class]="'action-' + action.color"
                (click)="navigateTo(action.route)">
                <mat-card-content>
                    <div class="action-content">
                        <mat-icon class="action-icon">{{ action.icon }}</mat-icon>
                        <div class="action-title">{{ action.title }}</div>
                    </div>
                </mat-card-content>
            </mat-card>
        </div>
    </div>
</div>
