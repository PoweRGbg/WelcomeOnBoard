<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Welcome On Board</mat-card-title>
      <mat-card-subtitle>{{ 'ONBOARDING.LOGIN_MESSAGE' | translate }}</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'ONBOARDING.USER_NAME' | translate }}</mat-label>
          <input matInput formControlName="username" placeholder="{{ 'ONBOARDING.USER_NAME_PLACEHOLDER' | translate }}">
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            {{ 'ONBOARDING.USER_NAME_ERROR' | translate }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'ONBOARDING.PASSWORD' | translate }}</mat-label>
          <input matInput formControlName="password" placeholder="{{ 'ONBOARDING.PASSWORD_PLACEHOLDER' | translate }}" type="password">
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            {{ 'ONBOARDING.PASSWORD_ERROR' | translate }}
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width" 
                [disabled]="!loginForm.valid">
          {{ 'ONBOARDING.LOGIN' | translate }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
