<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Welcome On Board</mat-card-title>
      <mat-card-subtitle>Моля въведете вашия потребителско име и парола</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Потребителско име</mat-label>
          <input matInput formControlName="username" placeholder="Въведи потребителско име">
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            Потребителското име е задължително
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Парола</mat-label>
          <input matInput formControlName="password" placeholder="Въведи парола" type="password">
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Въведи парола
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width" 
                [disabled]="!loginForm.valid">
          Вход
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
